<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Login</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header  class="Cabecalho-principal">
        <div class="logo">
            <h1>Loja de jogos</h1>

        </div>
        
        <nav>   
            <ul class="menu-navegacao">
                <li><a href="index.html" class="link-inicial">Inicio</a></li>
                <li><a href="login.html" class="link-login">Entrar</a></li>

            </ul>
        </nav>

    </header>

    <main class="conteudo-login">
        <div class="cartao-login">
            <h2>Acessar Painel Inicial</h2>
            <p class="Subtitulo-login">Digite seus dados</p>
            <form action="#" method="POST">
                <div class="campo-grupo">
                    <label for="campo-email">Email:</label>
                    <input type="email" id="campo-email" name="email" placeholder="***@****.com" required>
                    <br>
                    <label for="campo-senha">Senha:</label>
                    <input type="password" id="campo-senha" name="senha" placeholder="******"  minlength="6" required>
                </div>

                <div class="campo-lembrete">
                    <input type="checkbox" id="lembrar-login" name="lembrar">
                    <label for="lembrar-login">Manter minha sessão logada neste aparelho</label>
                </div>
                <button type="submit" class="btn-submeter">Entrar</button>
            </form>
            <div class="rodape-card-login">
                <a href="#">Esqueci minha senha</a>
                <span> | </span>
                <a href="#">Criar nova conta</a>
            </div> 
        </div>
    </main>
    <footer class="rodape">
        <p>&copy 2026 Loja de Jogos</p>
        <p>Desenvolvido por: <a href="portifolio.html" target="_blank" rel="noopener noreferrer">Fabrício</a></p>
    </footer>    
</body>
</html>
